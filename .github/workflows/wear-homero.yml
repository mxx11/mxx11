name: Wear OS app (Hőmérők) – APK build

on:
  push:
    paths:
      - 'wear-homero/**'
      - '.github/workflows/wear-homero.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear-homero
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK fordítása
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/release/app-release.apk homero-wear.apk

      - uses: actions/upload-artifact@v4
        with:
          name: homero-wear-apk
          path: wear-homero/homero-wear.apk
